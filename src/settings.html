<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Markdown 快捷转图片</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <div class="eyebrow">MARKDOWN → PNG</div>
    <h1 data-i18n="heading">复制 Markdown，直接粘贴图片。</h1>
    <p class="intro"><span data-i18n="introBefore">在目标输入框按 </span><kbd id="paste-hotkey-label">Ctrl+Alt+V</kbd><span data-i18n="introAfter">，转为图片并立即粘贴。</span><br><span data-i18n="introSecondBefore">之后按 Ctrl+V 也能粘贴这张图；按 </span><kbd id="hotkey-label">Ctrl+Alt+M</kbd><span data-i18n="introSecondAfter"> 可另存图片。</span></p>
    <div class="actions">
      <button id="export" class="primary" data-i18n="saveClipboard">保存剪贴板为图片</button>
      <button id="copy-image" data-i18n="copyImage">转为图片并复制</button>
      <button id="open-recent" disabled data-i18n="viewRecent">查看最近保存</button>
    </div>
    <div id="status" role="status">准备就绪</div>
    <section>
      <div class="language-setting"><label for="language" data-i18n="language">语言 / Language</label><select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></div>
      <label class="toggle" for="copy-after-export">
        <span><span data-i18n="autoCopy">保存后自动复制图片</span><small data-i18n="autoCopyHint">只影响保存操作；图片粘贴快捷键始终复制并粘贴图片</small></span>
        <input id="copy-after-export" type="checkbox" role="switch">
      </label>
      <label data-i18n="outputLocation">保存位置</label>
      <div id="output-dir" class="path"></div>
      <div class="folder-actions"><button id="choose-folder" data-i18n="changeLocation">更改位置</button><button id="open-folder" data-i18n="openFolder">打开文件夹</button></div>
      <form id="settings">
        <label for="paste-hotkey" data-i18n="pasteHotkey">图片粘贴快捷键</label>
        <input id="paste-hotkey" type="text" value="Control+Alt+V" spellcheck="false" autocomplete="off">
        <small data-i18n="pasteHotkeyHint">转换剪贴板文字，复制图片并粘贴到当前输入位置</small>
        <label class="save-hotkey-label" for="hotkey" data-i18n="saveHotkey">保存图片快捷键</label>
        <input id="hotkey" type="text" value="Control+Alt+M" spellcheck="false" autocomplete="off" aria-describedby="hotkey-hint">
        <small id="hotkey-hint" data-i18n="hotkeyHint">例如 Control+Alt+M 或 Control+Shift+F8</small>
        <div class="columns">
          <div><label for="width" data-i18n="imageWidth">图片宽度</label><select id="width"><option value="720" data-i18n="width720">720 px · 窄版</option><option value="1080" data-i18n="width1080">1080 px · 标准</option><option value="1440" data-i18n="width1440">1440 px · 宽表格</option></select></div>
          <div><label for="theme" data-i18n="theme">界面与图片主题</label><select id="theme" aria-describedby="theme-hint"><option value="light" data-i18n="light">浅色</option><option value="dark" data-i18n="dark">深色</option></select><small id="theme-hint" data-i18n="themeHint">切换立即保存。已有图片保留原样，重新复制 Markdown 后转换。</small></div>
        </div>
        <button type="submit" data-i18n="saveSettings">保存设置</button><span id="saved" role="status"></span>
      </form>
    </section>
    <footer data-i18n="footer">支持表格、代码高亮、数学公式。关闭窗口后仍在托盘运行；右键托盘图标可退出。内容在本机处理，外部图片显示占位文字。</footer>
  </main>
  <script src="translations.js"></script><script src="i18n.js"></script><script src="settings.js"></script>
</body>
</html>
